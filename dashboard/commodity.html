    --text: #1a2233; --muted: #64708a;

    --grid: rgba(100, 112, 138, 0.16);
    --up: #157f3d; --down: #c92a2a; --amber: #b45309;
    --up-soft: rgba(21, 127, 61, 0.12); --down-soft: rgba(201, 42, 42, 0.10);
    --out-soft: rgba(100, 112, 138, 0.16);
    --tab-hover: #eceef2; --tooltip-bg: rgba(255, 255, 255, 0.97);
    --flash: rgba(37, 99, 235, 0.18);
    --chg: #7c3aed; --chg-soft: rgba(124, 58, 237, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 20px; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .stamp { color: var(--muted); font-size: 11px; text-align: right; line-height: 1.55; white-space: nowrap; font-variant-numeric: tabular-nums; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  h1 .ver { color: var(--muted); font-weight: 600; font-size: 13px; margin-left: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 18px; }
  .sub b { color: var(--text); font-weight: 600; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
    font: 600 13px/1 inherit; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { background: var(--tab-hover); color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pip.in { background: var(--up); } .pip.outp { background: var(--down); }
  .tab.active .pip.in { background: #b3f0c8; } .tab.active .pip.outp { background: #ffc2c2; }
  /* Recently changed (user, 2026-08-04): the signal flipped, or the flip-risk light
     moved colour, within the last RECENT_N sessions. Colour is NOT the only cue - the
     tab also carries a tinted ring, a raised marker and a title attribute, so it still
     reads under colour-blindness, greyscale printing and forced-colors. */
  .tab.chg { border-color: var(--chg); background: var(--chg-soft); }
  .tab.chg .lbl { color: var(--chg); font-weight: 800; }
  .tab.chg .chgmark { color: var(--chg); font-size: 9px; vertical-align: super; margin-left: -3px; }
  .tab.active.chg { background: var(--accent); border-color: var(--accent); }
  .tab.active.chg .lbl, .tab.active.chg .chgmark { color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  .caveat { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .lbl { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .val { font-size: 21px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tile .note { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.45; }
  .tiles.onerow { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .onerow .tile { padding: 8px 10px; }
  .onerow .tile .val { font-size: 15px; }
  .onerow .tile .lbl { font-size: 9.5px; }
  .onerow .tile .note { font-size: 10px; }
  .wraptbl td { white-space: normal; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; font-weight: 650; margin-bottom: 10px; }

  .legend { display: flex; flex-wrap: wrap; gap: 13px; color: var(--muted); font-size: 12px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .tri { width: 0; height: 0; display: inline-block; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 8px solid var(--down); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--up); display: inline-block; }
  .bandsw { width: 14px; height: 10px; display: inline-block; border-radius: 2px; }
  .rangebtns { display: flex; gap: 4px; flex-wrap: wrap; }
  .rangebtns button {

    padding: 4px 10px; border-radius: 6px; cursor: pointer; font: 600 12px/1 inherit; font-family: inherit;
  }
  .rangebtns button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart-box { position: relative; width: 100%; height: 460px; }
  .chart-box canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

    padding: 8px 11px; font-size: 12px; line-height: 1.6; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); font-variant-numeric: tabular-nums;

  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.5; }

  .boardnav a { color:var(--muted); }

  .boardnav a::after { content:" \2197"; opacity:.55; font-size:10px; }

  th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border); font-size: 12.5px; white-space: nowrap; }

  td.grpl, th.grpl { border-left: 1px solid var(--border); }
  tbody tr:hover { background: var(--accent-soft); }
  tfoot td { color: var(--muted); font-size: 11.5px; white-space: normal; line-height: 1.55; border-bottom: none; padding-top: 10px; }
  .rdg { color: var(--muted); font-size: 11px; margin-top: 1px; }

  .chip.outchip { background: var(--down-soft); color: var(--down); }
  .chip.win { background: var(--up-soft); color: var(--up); }
  .chip.loss { background: var(--down-soft); color: var(--down); }
  .chip.open { background: var(--accent-soft); color: var(--accent); }

  .roibar { flex: 1 0 10px; max-width: 34px; position: relative; height: 100%; cursor: pointer; }
  .roibar .col { position: absolute; left: 15%; right: 15%; border-radius: 3px 3px 0 0; }
  .roibar:hover .col { filter: brightness(1.2); }
  .roibaraxis { border-top: 1px solid var(--border); margin-top: 0; padding-top: 5px; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  @media (max-width: 720px) { .chart-box { height: 380px; } body { padding: 12px; } }

        &bull; <b>Two-stage bear mask</b> and the <b>Volatility Model</b> second opinion<br>
        Only the 2/3 confirmation below survives. Bear probability is still recorded, but it is now
        <b>diagnostic only</b> &mdash; it gates nothing.<br>
        <span style="opacity:.75">Full version history, with return and drawdown by era: see <b>model_history.html</b></span></td></tr>

  const v12Card = `<div class="card"><h2>Dual model &mdash; how a market gets its signal</h2>
    <div class="tblwrap wraptbl"><table><tbody>
      <tr><td class="l" style="font-weight:650">The idea</td>

  const specV13 = `<div class="card"><h2>Two models, one per market</h2>

        <b>Known limitation:</b> which model each market uses was decided after seeing these

      ${referenceRow}
    </tbody></table></div></div>`;

  const methodCard = BBM.has(SUFFIX) ? specV13 : SUFFIX === "V12" ? v12Card : SUFFIX === "V11" ? v11Card : SUFFIX === "BL" ? `<div class="card"><h2>Statistical Jump Model Baseline — factory default setting</h2>
    <div class="tblwrap wraptbl"><table><tbody>

        • <b>Downside risk</b> — log EWM downside deviation (negative days only)<br>
        • <b>Risk-adjusted</b> — Sortino ratio (trend ÷ downside deviation)</td></tr>
      <tr><td class="l" style="font-weight:650">Preprocessing</td>
        <td class="l">Features clipped at ±3σ, standardized on training-window statistics only — the paper's

      <tr><td class="l" style="font-weight:650">Jump penalty λ</td>
        <td class="l">Fixed cost per regime switch (larger λ = fewer, more persistent regimes), re-selected

    : `<div class="card"><h2>Statistical Jump Model ${SUFFIX === "V7" ? "v8" : SUFFIX === "V9" ? "v9" : SUFFIX === "V10" ? "v10" : SUFFIX.toLowerCase()} — changes vs the baseline</h2>

  p.innerHTML = `

  if (!(SUFFIX in modelCardsBySuffix)) {

  p.querySelectorAll(".roibar").forEach(b => b.onclick = () => flashRow(k, +b.dataset.i));
  charts[k] = makeChart(k, r);
}

// ---------- interactive chart ----------
function makeChart(k, r) {
  const N = r.dates.length, LAST = N - 1;
  const U = r.unit ?? "$";
  const cv = document.getElementById("cv-" + k), tt = document.getElementById("tt-" + k);
  const ctx = cv.getContext("2d");
  let R0 = 0, R1 = LAST;

  const markers = [];
  r.trades.forEach((t, ki) => {
    const bi = r.dates.indexOf(t.buy_date);
    if (bi >= 0) markers.push({ i: bi, type: "buy", k: ki });
    if (!t.open && t.sell_date) {
      const si = r.dates.indexOf(t.sell_date);
      if (si >= 0) markers.push({ i: si, type: "sell", k: ki });
    }
  });
  const bands = [];
  {
    let s = null;
    for (let i = 0; i < N; i++) {
      if (r.pos[i] === 0 && s === null) s = i;
      if ((r.pos[i] === 1 || i === LAST) && s !== null) { bands.push([s, r.pos[i] === 1 ? i : LAST]); s = null; }
    }
  }
  const idx2009 = r.dates.findIndex(d => d >= "2009-01-01");
  const findDate = d => { const i = r.dates.findIndex(x => x >= d); return i < 0 ? LAST : i; };
  const cbands = (r.crises || []).map(c => [findDate(c.start), findDate(c.end)]).filter(([a, b]) => b > a);

  let hitMarkers = [], geo = null;

  function layout() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function niceLogTicks(lo, hi) {
    const ticks = [], bases = [1, 2, 5];
    for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
      for (const b of bases) { const v = b * 10 ** e; if (v >= lo && v <= hi) ticks.push(v); }
    while (ticks.length > 6) for (let i = ticks.length - 2; i >= 0; i -= 2) ticks.splice(i, 1);
    return ticks;
  }

  function draw() {
    if (!cv.clientWidth) return; // hidden panel
    const { w, h } = layout();
    ctx.clearRect(0, 0, w, h);
    const mL = 8, mR = 56, mT = 8, gap = 26;
    const priceH = Math.round((h - mT - gap - 20) * 0.60);
    const eqH = h - mT - priceH - gap - 20;
    const pw = w - mL - mR;
    const x = i => mL + pw * (i - R0) / Math.max(R1 - R0, 1);

    let pLo = Infinity, pHi = -Infinity, eLo = Infinity, eHi = -Infinity;
    for (let i = R0; i <= R1; i++) {
      if (r.close[i] < pLo) pLo = r.close[i];
      if (r.close[i] > pHi) pHi = r.close[i];
      const a = Math.min(r.eq_strat[i], r.eq_bh[i]), b = Math.max(r.eq_strat[i], r.eq_bh[i]);
      if (a < eLo) eLo = a;
      if (b > eHi) eHi = b;
    }
    pLo *= 0.94; pHi *= 1.06; eLo *= 0.94; eHi *= 1.06;
    const yP = v => mT + priceH * (1 - (Math.log(v) - Math.log(pLo)) / (Math.log(pHi) - Math.log(pLo)));
    const yE = v => mT + priceH + gap + eqH * (1 - (Math.log(v) - Math.log(eLo)) / (Math.log(eHi) - Math.log(eLo)));

    ctx.fillStyle = css("--down-soft");
    for (const [a, b] of cbands) {
      if (b < R0 || a > R1) continue;
      const xa = x(Math.max(a, R0)), xb = x(Math.min(b, R1));
      ctx.fillRect(xa, mT, Math.max(xb - xa, 1), priceH);
      ctx.fillRect(xa, mT + priceH + gap, Math.max(xb - xa, 1), eqH);
    }
    ctx.fillStyle = css("--out-soft");
    for (const [a, b] of bands) {
      if (b < R0 || a > R1) continue;
      const xa = x(Math.max(a, R0)), xb = x(Math.min(b, R1));
      ctx.fillRect(xa, mT, Math.max(xb - xa, 1), priceH);
      ctx.fillRect(xa, mT + priceH + gap, Math.max(xb - xa, 1), eqH);
    }

    ctx.font = "11px Segoe UI, system-ui, sans-serif";
    ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--muted");
    ctx.lineWidth = 1; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (const tk of niceLogTicks(pLo, pHi)) {
      ctx.beginPath(); ctx.moveTo(mL, yP(tk)); ctx.lineTo(w - mR, yP(tk)); ctx.stroke();
      ctx.fillText(U + (tk >= 1000 ? (tk / 1000) + "k" : tk), w - mR + 6, yP(tk));
    }
    for (const tk of niceLogTicks(eLo, eHi)) {
      ctx.beginPath(); ctx.moveTo(mL, yE(tk)); ctx.lineTo(w - mR, yE(tk)); ctx.stroke();
      ctx.fillText((tk / 1e4).toLocaleString("en-US") + "×", w - mR + 6, yE(tk));
    }

    // x labels (year boundaries present in the visible window)
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    const y0 = +r.dates[R0].slice(0, 4), y1 = +r.dates[R1].slice(0, 4);
    const step = Math.max(1, Math.ceil((y1 - y0 + 1) / Math.floor(pw / 55)));
    let lastYr = +r.dates[R0].slice(0, 4) - 1;
    for (let i = R0; i <= R1; i++) {
      const yr = +r.dates[i].slice(0, 4);
      if (yr > lastYr) {
        if ((yr - y0) % step === 0 && i > R0 + 2) {
          ctx.fillText(String(yr), x(i), h - 16);
          ctx.strokeStyle = css("--grid");
          ctx.beginPath(); ctx.moveTo(x(i), mT); ctx.lineTo(x(i), h - 20); ctx.stroke();
        }
        lastYr = yr;
      }
    }
    // month labels when zoomed within ~2 years
    if (R1 - R0 < 520) {
      let lastMo = r.dates[R0].slice(0, 7);
      for (let i = R0 + 1; i <= R1; i++) {
        const mo = r.dates[i].slice(0, 7);
        if (mo !== lastMo) {
          const lab = new Date(r.dates[i] + "T00:00:00").toLocaleDateString("en-US", { month: "short" });
          ctx.fillStyle = css("--muted");
          ctx.fillText(lab, x(i), h - 16);
          lastMo = mo;
        }
      }
    }

    if (idx2009 >= R0 && idx2009 <= R1) {
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x(idx2009), mT); ctx.lineTo(x(idx2009), h - 20); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText("2009 split", x(idx2009) + 4, mT + 2);
    }

    function line(arr, yFn, color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
      let started = false;
      const stride = Math.max(1, Math.floor((R1 - R0) / (pw * 2)));
      for (let i = R0; i <= R1; i += stride) {
        const xx = x(i), yy = yFn(arr[i]);
        if (!started) { ctx.moveTo(xx, yy); started = true; } else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    line(r.close, yP, css("--accent"), 1.4);
    line(r.eq_bh, yE, css("--muted"), 1.2);
    line(r.eq_strat, yE, css("--accent"), 1.6);

    ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "600 11px Segoe UI, system-ui, sans-serif";
    ctx.fillText(r.symbol + " CLOSE (LOG)", mL + 2, mT + 2);
    ctx.fillText(`CUMULATIVE GROWTH (×) — ${tagOf(r)} vs BUY & HOLD (LOG)`, mL + 2, mT + priceH + gap + 2);

    hitMarkers = [];
    for (const m of markers) {
      if (m.i < R0 || m.i > R1) continue;
      const xx = x(m.i), yy = yP(r.close[m.i]);
      if (m.type === "buy") {
        ctx.fillStyle = css("--up");
        ctx.beginPath(); ctx.arc(xx, yy + 11, 4.5, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = css("--down");
        ctx.beginPath();
        ctx.moveTo(xx, yy - 6); ctx.lineTo(xx - 4.5, yy - 14); ctx.lineTo(xx + 4.5, yy - 14);
        ctx.closePath(); ctx.fill();
      }
      hitMarkers.push({ x: xx, y: m.type === "buy" ? yy + 11 : yy - 10, m });
    }
    if (R1 - R0 < 2600) {
      ctx.fillStyle = css("--muted"); ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.font = "600 9px Segoe UI, system-ui, sans-serif";
      for (const hm of hitMarkers) if (hm.m.type === "sell")
        ctx.fillText(String(hm.m.k + 1), hm.x, hm.y - 8);
    }
    geo = { x, mL, mR, mT, w, h };
  }

  // --- range buttons
  const rb = document.getElementById("rb-" + k);
  function setBtn(rname) {
    rb.querySelectorAll("button").forEach(o => o.classList.toggle("on", o.dataset.r === rname));
  }
  rb.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      setBtn(b.dataset.r);
      const rr = b.dataset.r;
      if (rr === "all") { R0 = 0; R1 = LAST; }
      else if (rr === "pre") { R0 = 0; R1 = findDate("2010-01-01"); }
      else if (rr === "fed") { R0 = findDate("2010-01-01"); R1 = findDate("2022-01-01"); }
      else if (rr === "infl") { R0 = findDate("2022-01-01"); R1 = LAST; }
      else if (rr === "5y") { R0 = Math.max(0, LAST - 5 * 252); R1 = LAST; }
      else if (rr === "1y") { R0 = Math.max(0, LAST - 252); R1 = LAST; }
      draw();
    };
  });

  // --- zoom (wheel), pan (drag), reset (double-click)
  cv.addEventListener("wheel", ev => {
    ev.preventDefault();
    if (!geo) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const frac = Math.min(Math.max((mx - geo.mL) / (geo.w - geo.mL - geo.mR), 0), 1);
    const center = R0 + frac * (R1 - R0);
    const factor = ev.deltaY > 0 ? 1.18 : 1 / 1.18;
    let span = Math.round((R1 - R0) * factor);
    span = Math.min(Math.max(span, 25), N);
    R0 = Math.round(center - frac * span);
    R1 = R0 + span;
    if (R0 < 0) { R1 -= R0; R0 = 0; }
    if (R1 > LAST) { R0 -= (R1 - LAST); R1 = LAST; R0 = Math.max(R0, 0); }
    setBtn("");
    draw();
  }, { passive: false });

  let dragStart = null, dragged = false;
  cv.addEventListener("mousedown", ev => {
    dragStart = { x: ev.clientX, R0, R1 };
    dragged = false;
  });
  window.addEventListener("mousemove", ev => {
    if (!dragStart || !geo) return;
    const dx = ev.clientX - dragStart.x;
    if (Math.abs(dx) > 3) dragged = true;
    if (!dragged) return;
    const pw = geo.w - geo.mL - geo.mR;
    const span = dragStart.R1 - dragStart.R0;
    let di = Math.round(-dx / pw * span);
    let n0 = dragStart.R0 + di, n1 = dragStart.R1 + di;
    if (n0 < 0) { n1 -= n0; n0 = 0; }
    if (n1 > LAST) { n0 -= (n1 - LAST); n1 = LAST; n0 = Math.max(n0, 0); }
    R0 = n0; R1 = n1;
    cv.style.cursor = "grabbing";
    tt.style.display = "none";
    draw();
  });
  window.addEventListener("mouseup", () => { dragStart = null; cv.style.cursor = "crosshair"; });
  cv.addEventListener("dblclick", () => { R0 = 0; R1 = LAST; setBtn("all"); draw(); });

  // --- tooltip + marker click
  cv.addEventListener("mousemove", ev => {
    if (!geo || dragged) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    let onMarker = null;
    for (const hm of hitMarkers)
      if (Math.abs(hm.x - mx) < 6 && Math.abs(hm.y - my) < 8) { onMarker = hm; break; }
    cv.style.cursor = onMarker ? "pointer" : "crosshair";
    const i = Math.round(R0 + (mx - geo.mL) / (geo.w - geo.mL - geo.mR) * (R1 - R0));
    if (i < R0 || i > R1 || mx < geo.mL || mx > geo.w - geo.mR) { tt.style.display = "none"; return; }
    const tr = onMarker ? r.trades[onMarker.m.k] : null;
    tt.innerHTML = onMarker
      ? `<b>${onMarker.m.type === "buy" ? "BUY" : "SELL"} — trade #${onMarker.m.k + 1}</b><br>
         ${dShort(r.dates[onMarker.m.i])} · ${U}${fmt(r.close[onMarker.m.i])}<br>ROI ${pct(tr.roi)} — click for log row`
      : `<b>${dShort(r.dates[i])}</b><br>${r.symbol} ${U}${fmt(r.close[i])} · regime <b style="color:${r.state[i] === 0 ? "var(--up)" : "var(--down)"}">${r.state[i] === 0 ? "BULL" : "BEAR"}</b>
         · ${r.pos[i] === 1 ? "IN" : "OUT"}<br>${tagOf(r)} ${mult(r.eq_strat[i] / 1e4)} · B&amp;H ${mult(r.eq_bh[i] / 1e4)}`;
    tt.style.display = "block";
    const bw = tt.offsetWidth;
    tt.style.left = Math.min(mx + 14, geo.w - bw - 8) + "px";
    tt.style.top = Math.max(my - 40, 4) + "px";
  });
  cv.addEventListener("mouseleave", () => { tt.style.display = "none"; });
  cv.addEventListener("click", ev => {
    if (dragged) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    for (const hm of hitMarkers)
      if (Math.abs(hm.x - mx) < 7 && Math.abs(hm.y - my) < 9) { flashRow(k, hm.m.k); return; }
  });

  return { draw };
}

// ---------- build ----------
// ref_only payloads (e.g. the NDX reference shipped with the stock dashboard
// solely for the Era Performance NDQ benchmark row) get no tab or panel.
for (const k of KEYS) if (!DATA[k].ref_only) buildPanel(k, DATA[k]);
// Name what the highlight means, and only when something is actually highlighted -
// a permanent legend for an empty state is noise on the ~340 days a year nothing moved.
{
  const moved = KEYS.filter(k => !DATA[k].ref_only && recentChange(DATA[k]).length)
                    .map(k => DATA[k].symbol);
  const note = document.getElementById("chgnote");
  if (note && moved.length) {
    note.style.display = "";
    note.innerHTML = `<span style="color:var(--chg);font-weight:700">${moved.join(", ")}</span>`
      + ` changed in the last ${RECENT_N} trading days — the signal flipped or the flip-risk`
      + ` light moved colour. Hover the ticker for which.`;
  }
}
{
  let histCard = "";
  if (HISTORY.length) {
    const hrows = HISTORY.map(h => `<tr>
      <td class="l" style="font-weight:650; min-width:130px">${h.stage}</td>
      <td class="l" style="min-width:120px">${h.org}</td>
      <td class="l" style="min-width:160px">${h.who}</td>
      <td class="l">${h.what}</td></tr>`).join("");
    histCard = `<div class="card"><h2>Model history — where the Jump Model comes from</h2>
      <div class="tblwrap wraptbl"><table><thead><tr>
        <th class="l">Stage</th><th class="l">Organisation</th><th class="l">Who</th><th class="l">What</th>
      </tr></thead><tbody>${hrows}</tbody></table></div></div>`;
  }
  const mp = document.createElement("div");
  mp.className = "panel"; mp.id = "panel-model";
  const modelCards = ["BL","V1","V2","V3","V4","V5","V6","V7","V9","V10","V11","V12","V13","V14","V15","V16"].filter(s => s in modelCardsBySuffix).map(s => modelCardsBySuffix[s]);
  const boardFirst = KEYS.some(k => BBM.has(DATA[k].variant));
  mp.innerHTML = boardFirst ? modelCards.join("") + histCard
                            : histCard + modelCards.join("");
  panelsEl.appendChild(mp);
  addTab("model", "Model", null);
}
activate(KEYS.find(k => !DATA[k].ref_only));

window.addEventListener("resize", () => { const a = document.querySelector(".tab.active"); if (a) charts[a.dataset.target].draw(); });
const redrawActive = () => { const a = document.querySelector(".tab.active"); if (a) charts[a.dataset.target].draw(); };
new MutationObserver(redrawActive).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawActive);
</script>
