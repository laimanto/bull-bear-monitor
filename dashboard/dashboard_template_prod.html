         zone ? zone.color : null, sigBear === inMkt, recentChange(r));
  const dataStart = (r.train_start ? dShort(r.train_start) : dShort(r.start)) + (TRAIN_NOTE[r.symbol] ?? "");
  const p = document.createElement("div");
  p.className = "panel"; p.id = "panel-" + k;

  let sinceIdx = LAST;
  while (sinceIdx > 0 && r.state[sinceIdx - 1] === r.state[LAST]) sinceIdx--;
  const pf = r.panels.full, edge = (1 + pf.strat.total) / (1 + pf.bh.total);

  // --- choppy-market note: the published signal itself flipped often
  // recently. Pure display - computed from the already-published state
  // array, no decode/payload change. Trigger: >=3 flips in the last 40
  // published trading days (~2 months); under v6's 8-day minimum hold that
  // means the market has been running close to the floor, not a one-off.
  const CHOP_WINDOW = 40, CHOP_MIN_FLIPS = 3;
  const chopStart = Math.max(1, LAST - CHOP_WINDOW + 1);
  let chopFlips = 0;
  for (let i = chopStart; i <= LAST; i++) if (r.state[i] !== r.state[i - 1]) chopFlips++;
  const isChoppy = chopFlips >= CHOP_MIN_FLIPS;
  const chopBanner = isChoppy
    ? `<div style="margin-top:12px; padding:10px 14px; border-radius:8px; font-weight:650; font-size:13px;
        color:var(--amber); background:color-mix(in srgb, var(--amber) 14%, transparent)">
        ⚡ Choppy market — the signal has flipped ${chopFlips} times in the last ${CHOP_WINDOW} trading days.
        Treat the current call as lower-conviction than usual.</div>`
    : "";

  // --- Signal section: signal, flip risk, prices, current trade
  // Historical note values are converted with the DISPLAYED state at each
  // historical date (state array index LAST-5 / LAST-10 matches the payload's
  // p_bear_1w = iloc[-6] / p_bear_2w = iloc[-11] convention).
  const flip1w = flipPct(r.state[Math.max(LAST - 5, 0)] === 0, sig.p_bear_1w);
  const flip2w = flipPct(r.state[Math.max(LAST - 10, 0)] === 0, sig.p_bear_2w);
  // THE HORIZON IS DELIBERATELY OFF THE LABEL (user, 2026-08-11), reversing the 08-10 note
  // that said it must stay. It only ever had to be there because the old number was a
  // 21-day level that saturated - it read 100% two days out AND one day out, so the label
  // was carrying meaning the number had lost. The number now encodes urgency by itself:
  // median sessions-to-flip runs 132 / 55 / 34 / 19 / 14 / 8 / 2 / 1 down the scale, so a
  // reader takes 93% as "tomorrow" and 20% as "weeks away" and is right both times. At the
  // top of the range the 5-session figure IS a next-day figure - 89.6% next session against
  // 93.8% within five. See flip_calibrate.py.
  //
  // The COUNTDOWN line carries what a horizon label never could: with 2+ confirmation days
  // outstanding a flip tomorrow is not unlikely, it is impossible (0.000% over 123,400
  // market-days). It is also the part that visibly reverts when a setup breaks - "1 of 2
  // confirmed" falling back to "0 of 2" - which the percentage alone hides.
  const fNeed = sig.flip_need, fReq = sig.flip_req;
  const tgtWord = r.current_state === "bull" ? "bear" : "bull";
  const cdown = (fNeed == null || fReq == null) ? ""
    : fNeed <= 0 ? "confirmed &mdash; flip publishing"
    : `${fReq - fNeed} of ${fReq} ${tgtWord} days confirmed`
      + (fNeed >= 2 ? " &middot; cannot flip tomorrow" : " &middot; one more does it");
  const flipTile = `<div class="tile"><div class="lbl">Flip to ${r.current_state === "bull" ? "Bear" : "Bull"}</div>
    <div class="val" ${zone ? `style="color:${zone.color}"` : ""}>${zone ? `${zone.name} · ${pctu(zone.pct, 0)}` : "–"}</div>
    ${cdown ? `<div class="note">${cdown}</div>` : ""}
    <div class="note">1&thinsp;wk ago ${pctu(flip1w, 0)} · 2&thinsp;wk ago ${pctu(flip2w, 0)}</div></div>`;

  const t0 = sig.trade ?? {};
  const inTrade = t0.status === "in";
  const tradeTiles = inTrade
    ? `<div class="tile"><div class="lbl">Entry price</div>
        <div class="val">${U}${fmt(t0.entry_price)}</div>
        <div class="note">bought ${dShort(t0.entry)} · ${t0.days}&thinsp;trading days ago</div></div>
      <div class="tile"><div class="lbl">Last price</div><div class="val">${U}${fmt(r.last_close)}</div>
        <div class="note">${dShort(r.end)}</div></div>
      <div class="tile"><div class="lbl">Trade ROI</div>
        <div class="val ${cls(t0.roi)}">${pct(t0.roi)}</div>
        <div class="note">since entry, net of costs</div></div>
      <div class="tile"><div class="lbl">Trade max DD</div>
        <div class="val neg">${pct(t0.max_dd)}</div>
        <div class="note">worst dip since entry</div></div>
      <div class="tile"><div class="lbl">Off peak</div>
        <div class="val ${cls(t0.off_peak)}">${pct(t0.off_peak)}</div>
        <div class="note">vs the trade's highest close</div></div>`
    : `<div class="tile"><div class="lbl">Exit price</div>
        <div class="val">${U}${fmt(t0.exit_price)}</div>
        <div class="note">sold ${t0.exit ? dShort(t0.exit) : "–"} · ${t0.days ?? "–"}&thinsp;trading days ago</div></div>
      <div class="tile"><div class="lbl">Last price</div><div class="val">${U}${fmt(r.last_close)}</div>
        <div class="note">${dShort(r.end)}</div></div>
      <div class="tile"><div class="lbl">Last trade ROI</div>
        <div class="val ${cls(t0.roi)}">${pct(t0.roi)}</div>
        <div class="note">that closed trade, net of costs</div></div>
      <div class="tile"><div class="lbl">Trade max DD</div>
        <div class="val neg">${pct(t0.max_dd)}</div>
        <div class="note">worst dip during that trade</div></div>
      <div class="tile"><div class="lbl">Off peak</div>
        <div class="val ${cls(t0.off_peak)}">${pct(t0.off_peak)}</div>
        <div class="note">at exit, vs that trade's highest close</div></div>`;

  const tiles = `<div class="card"><h2>Signal</h2><div class="tiles onerow" style="margin-bottom:0">
    ${(() => { const st = strengthOf(r.symbol); return `
    <div class="tile"><div class="lbl" style="display:flex;justify-content:space-between;gap:8px">
      <span>Signal</span>${st ? `<span>Strength</span>` : ""}</div>
      <div class="val ${r.current_state === "bull" ? "pos" : "neg"}"
        style="display:flex;justify-content:space-between;gap:8px">
        <span>${r.current_state.toUpperCase()}</span>${st
          ? `<span style="color:${st.color}">${st.label}${st.thin ? `<span style="vertical-align:super;font-size:10px">&nbsp;*</span>` : ""}</span>` : ""}</div>
      <div class="note">since ${dShort(r.dates[sinceIdx])} · ${sig.regime_age ?? LAST - sinceIdx + 1}&thinsp;trading days</div>
      ${sigBear === inMkt ? `<div class="note" style="color:var(--amber)">
        still ${inMkt ? "invested" : "in cash"} &mdash; the trade executes at the <b>next day&rsquo;s close</b></div>` : ""}</div>`; })()}
    ${flipTile}
    ${tradeTiles}
  </div>
  ${chopBanner}</div>`;

  // --- era performance (full period first)
  let eraRows = "";
  for (const key of ["full", "era1", "era2", "era3"]) {
    const e = r.panels[key];
    if (!e) continue;  // era predates this symbol's own test window
    const cap = (1 + e.strat.total) / (1 + e.bh.total);
    eraRows += `<tr><td class="l" rowspan="2" style="font-weight:650">${e.label}<div class="rdg">${e.start} → ${e.end} · ${pctu(e.time_in_mkt, 0)} in market</div></td>
      <td class="l">${TAG}</td>
      <td class="${cls(e.strat.cagr)}" style="font-weight:650">${pct(e.strat.cagr)}</td><td>${pctu(e.strat.vol)}</td>
      <td style="font-weight:650">${fmt(e.strat.sharpe)}</td><td>${fmt(e.strat.sortino)}</td>
      <td class="neg" style="font-weight:650">${pct(e.strat.mdd)}</td><td class="${cls(e.strat.total)}">${pct(e.strat.total, 0)}</td>
      <td style="font-weight:650">${mult(cap)}</td>
      <td rowspan="2" style="font-weight:650">${e.n_trades ?? "–"}</td></tr>
    <tr><td class="l" style="color:var(--muted)">Buy &amp; hold</td>
      <td class="${cls(e.bh.cagr)}">${pct(e.bh.cagr)}</td><td>${pctu(e.bh.vol)}</td>
      <td>${fmt(e.bh.sharpe)}</td><td>${fmt(e.bh.sortino)}</td>
      <td class="neg">${pct(e.bh.mdd)}</td><td class="${cls(e.bh.total)}">${pct(e.bh.total, 0)}</td><td></td></tr>`;
    if (key === "full" && r.symbol !== "NDX") {
      const ns = ndxStatsOver(e.start, e.end);
      if (ns != null) {
        eraRows += `<tr><td class="l" style="color:var(--muted); font-style:italic">NDQ (same period, reference)</td>
          <td class="l" style="color:var(--muted)">benchmark</td>
          <td style="color:var(--muted)">${pct(ns.cagr)}</td><td>–</td><td>–</td><td>–</td>
          <td class="neg" style="color:var(--muted)">${pct(ns.mdd)}</td><td>–</td>
          <td style="color:var(--muted)">${mult(ns.capture)}</td><td>–</td></tr>`;
      }
    }
  }
  const eraCard = `<div class="card"><h2>Era Performance</h2><div class="tblwrap">
    <table><thead><tr>
      <th class="l">Era</th><th class="l"></th><th>Avg yearly return</th><th>Volatility</th><th>Sharpe</th><th>Sortino</th>
      <th>Max drop</th><th>Total ROI</th><th>vs B&amp;H</th><th>Trades</th>
    </tr></thead><tbody>${eraRows}</tbody>
    <tfoot><tr><td colspan="10" class="l">
      Net of 10&thinsp;bps switch costs; the signal is read at the close and the trade is
      executed at the <b>next day&rsquo;s close</b>. Cash earns 3-month T-bills while out.
      <b>vs B&amp;H</b> = final wealth ÷ buy-and-hold's final wealth.
    </td></tr></tfoot></table></div></div>`;

  // --- chart card
  const chartCard = `<div class="card">
    <h2>${r.symbol} — price, signals and growth</h2>
    <div class="chart-head">
      <div class="legend">
        <span><span class="sw" style="background:var(--accent)"></span>${r.symbol} close (log)</span>
        <span><span class="dot"></span>Buy</span>
        <span><span class="tri"></span>Sell</span>
        <span><span class="bandsw" style="background:var(--out-soft)"></span>Out of market</span>
        <span><span class="bandsw" style="background:var(--down-soft)"></span>Crisis window</span>
        <span><span class="sw" style="background:var(--accent)"></span>${TAG} growth (×)</span>
        <span><span class="sw" style="background:var(--muted); opacity:.75"></span>Buy &amp; hold growth (×)</span>
      </div>
      <div class="rangebtns" id="rb-${k}">
        <button data-r="all" class="on">All</button><button data-r="pre">Pre-2009</button>
        <button data-r="fed">2010–2021</button><button data-r="infl">2022–now</button>
        <button data-r="5y">5Y</button><button data-r="1y">1Y</button>
      </div>
    </div>
    <div class="chart-box"><canvas id="cv-${k}"></canvas><div class="tooltip" id="tt-${k}"></div></div>
    <div class="hint">Red bands = the crises from the table above; grey bands = days out of the market —
      their overlap shows how much of each crisis was sidestepped.
      <b>Scroll to zoom · drag to pan · double-click to reset</b> · click a ●/▲ marker for its trade-log row.</div>
  </div>`;

  // --- per-trade ROI bars
  const t = r.trades;
  const maxAbs = Math.max(...t.map(x => Math.abs(x.roi)), 0.01);
  let bars = "";
  t.forEach((tr, i) => {
    const h = Math.abs(tr.roi) / maxAbs * 50;
    const up = tr.roi >= 0;
    bars += `<div class="roibar" data-i="${i}" title="Trade ${i + 1}: ${tr.buy_date} → ${tr.open ? "open" : tr.sell_date} · ROI ${pct(tr.roi)}">
      <div class="col" style="background:${up ? "var(--up)" : "var(--down)"};
        ${up ? `bottom:50%; height:${h}%` : `top:50%; height:${h}%; border-radius:0 0 3px 3px`}"></div>
    </div>`;
  });
  const wins = t.filter(x => x.roi > 0).length;
  const roiCard = `<div class="card"><h2>Trade ROI History</h2>
    <div class="roibars" id="roibars-${k}">${bars}</div>
    <div class="roibaraxis"><span>trade #1 · ${dShort(t[0].buy_date)}</span>
      <span>${wins}/${t.length} trades positive · scaled to largest |ROI| = ${pct(maxAbs)}</span>
      <span>#${t.length} · ${dShort(t[t.length - 1].buy_date)}</span></div>
    <div class="hint">One bar per round trip, net of costs — hover for dates, click for its trade-log row.</div></div>`;

  // --- trade log
  const tradeEnd = tr => tr.open ? r.end : tr.sell_date;
  const inCrisis = tr => r.crises.filter(cr => tr.buy_date <= cr.end && tradeEnd(tr) >= cr.start);
  let logRows = "";
  t.forEach((tr, i) => {
    const cnames = inCrisis(tr).map(c => c.name).join(", ");
    logRows += `<tr id="trrow-${k}-${i}">
      <td>${i + 1}</td>
      <td class="l">${tr.buy_date}</td><td>${U}${fmt(tr.buy_price)}</td>
      <td class="l">${tr.open ? "<b>still in</b>" : tr.sell_date}</td><td>${U}${fmt(tr.sell_price)}</td>
      <td>${tr.days}</td>
      <td class="${cls(tr.roi)}" style="font-weight:650">${pct(tr.roi)}</td>
      <td class="${tr.out_move == null ? "" : cls(tr.out_move)}">${tr.out_move == null ? "–" : pct(tr.out_move)}</td>
      <td class="l" style="color:${cnames ? "var(--down)" : "var(--muted)"}">${cnames || "–"}</td>
    </tr>`;
  });
  const logCard = `<div class="card"><h2>Trade Log</h2><div class="tblwrap">
    <table><thead><tr>
      <th>#</th><th class="l">Buy (close)</th><th>Buy price</th><th class="l">Sell (close)</th><th>Sell price</th>
      <th>Days held</th><th>Trade ROI</th><th>${r.symbol} while out</th><th class="l">Crisis</th>
    </tr></thead><tbody>${logRows}</tbody>
    <tfoot><tr><td colspan="9" class="l">
      One round trip per row, ROI net of costs. <b>${r.symbol} while out</b> = the index's move between this
      sell and the next buy (negative = the exit sidestepped a fall). <b>Crisis</b> = the crisis window this
      trade overlapped, if any. # matches the chart markers.
    </td></tr></tfoot></table></div></div>`;

  // --- crisis performance card
  let crows = "";
  for (const cr of r.crises) {
    const ntr = r.trades.filter(tr => tr.buy_date <= cr.end && (tr.open ? r.end : tr.sell_date) >= cr.start).length;
    crows += `<tr>
      <td class="l" style="font-weight:650">${cr.name}</td>
      <td class="l">${dShort(cr.peak)}</td><td class="l">${dShort(cr.trough)}</td>
      <td class="neg">${pct(cr.bh)}</td>
      <td class="${cls(cr.strat)}" style="font-weight:650">${pct(cr.strat)}</td>
      <td>${cr.exit_lag_days == null ? "never exited" : cr.exit_lag_days + "&thinsp;td"}</td>
      <td>${cr.reentry_lag_days == null ? "–" : cr.reentry_lag_days === 0 ? "in at trough" : cr.reentry_lag_days + "&thinsp;td"}</td>
      <td>${pctu(cr.pct_out, 0)}</td>
      <td>${ntr}</td>
    </tr>`;
  }
  const crisisCard = `<div class="card"><h2>Crisis Performance</h2>
    <div class="caveat"><b style="color:var(--text)">${r.full_name}</b>,
      ${BBM.has(SUFFIX) ? "Bull Bear Model" : "Jump Model"} ${SUFFIX === "BL" ? "baseline" : SUFFIX === "V7" ? "v8" : SUFFIX === "V9" ? "v9" : SUFFIX === "V10" ? "v10" : SUFFIX === "V11" ? "v11" : SUFFIX === "V12" ? "v12" : SUFFIX.toLowerCase()} · trained from <b>${dataStart}</b> ·
      tested ${dShort(r.start)} → ${dShort(r.end)}${U === "" ? " · index points, dividends excluded on both legs" : ""}${inMkt ? "" : ` · <b style="color:var(--down)">currently OUT</b>`}</div>
    <div class="tblwrap">
    <table><thead><tr>
      <th class="l">Crisis</th><th class="l">Peak</th><th class="l">Trough</th>
      <th>B&amp;H</th><th>${TAG}</th><th>Exit lag</th><th>Re-entry lag</th><th>% of window out</th><th>Trades</th>
    </tr></thead><tbody>${crows}</tbody>
    <tfoot><tr><td colspan="9" class="l">
      Peak → trough windows are this market’s <b>own</b> ≥20% peak-to-trough declines. <b>Exit lag</b> = trading days after the peak until the first day out (negative = already out before the peak);
      <b>Re-entry lag</b> = trading days after the trough until back in. The Model tab’s summary counts the same episodes, so the two agree.
      <b>% of window out</b> = share of the window spent in T-bills. <b>Trades</b> = round trips overlapping the window.
      Peak/trough are this market's own worst peak-to-trough decline within the window (not necessarily its
      global high/low) — a market that rallies net over a window can still show a real interior crash here.
      ${r.symbol === "GOLD" ? `<br><b>Gold's crisis list is different from every other tab on this dashboard</b> —
      gold often moves inversely to equities (a safe-haven hedge), so the equity crashes used elsewhere don't
      describe its real bear markets. These rows are gold's own peak-to-trough drawdowns (≥12%), verified from
      its own price history. The <b>2011–15 gold bear market</b> row only reflects its final ~2 years (2014
      onward) — the model's own training window starts 2008 and testing starts 2014, so the crisis's true
      early years (2011–2013, part of a −44% peak-to-trough move) are visible only in training, not in this
      live-tested figure.` : ""}
    </td></tr></tfoot></table></div></div>`;

  // --- methodology card
  const trainingCrisisText = (r.training_crises && r.training_crises.length)
    ? r.training_crises.join(", ")
    : "no major named crisis — a shorter or more recent history";
  const flipRow = `<tr><td class="l" style="font-weight:650">Flip-risk signal — added</td>
        <td class="l">
        • Descriptive only — layered on top of the regime call, not part of the trading rule<br>
        • The displayed % is always the chance of flipping <b>away from the shown signal</b><br>
        • In <b>BULL</b> (flip-to-bear risk): <b style="color:var(--up)">GREEN</b> ≤40% · <b style="color:var(--amber)">AMBER</b> 40–70% · <b style="color:var(--down)">RED</b> &gt;70%<br>
        • In <b>BEAR</b> (flip-to-bull chance): <b style="color:var(--down)">RED</b> ≤40% (deep in bear) · <b style="color:var(--amber)">AMBER</b> 40–70% · <b style="color:var(--up)">GREEN</b> &gt;70% (recovery near)<br>
        • Shown as each tab's second dot and in the Signal tile</td></tr>`;
  // How a published signal is produced. Every condition, both directions.
  const hasVeto  = ["V5","V6","V7","V9","V10"].includes(SUFFIX);
  const hasHold  = ["V6","V7","V9","V10"].includes(SUFFIX);
  const hasGate  = ["V4","V5","V6","V7","V9","V10","V11"].includes(SUFFIX);
  const hasVM    = ["V7","V9","V10"].includes(SUFFIX);
  const hasTrend = ["V9","V10"].includes(SUFFIX);
  const yes = '<b style="color:var(--up)">✓</b>';
  const no  = '<span style="color:var(--muted)">—</span>';
  const ruleLine = (what, bear, bull) =>
    `<tr><td class="l">${what}</td><td class="c">${bear}</td><td class="c">${bull}</td></tr>`;
  const ruleRows = [
    ruleLine("<b>Model call</b> — the jump model's own daily bull/bear reading",
             "says BEAR", "says BULL"),
    hasTrend ? (SUFFIX === "V10"
       ? ruleLine("<b>Long-term trend</b> — close vs its level 3 or 6 months ago",
                  "<b>either</b> below → BEAR", no + " no say in re-entry")
       : ruleLine("<b>Long-term trend</b> — close vs its level 3 / 6 / 12 months ago",
                  "<b>any one</b> below → BEAR", "all three must be above")) : "",
    hasGate ? ruleLine("<b>Days of agreement</b> before the signal may change",
             "<b>2</b> days", "<b>3</b> days") : "",
    hasVeto ? ruleLine("<b>Conviction check</b> — " + (hasVM
             ? "jump model + Volatility Model, averaged" : "the jump model's bear-probability"),
             "must be <b>≥ 60%</b>", no + " never required") : "",
    hasHold ? ruleLine("<b>Minimum hold</b> since the last change", "<b>8</b> trading days",
             "<b>8</b> trading days") : "",

// ---------- interactive chart ----------
function makeChart(k, r) {
  const N = r.dates.length, LAST = N - 1;
  const U = r.unit ?? "$";
  const cv = document.getElementById("cv-" + k), tt = document.getElementById("tt-" + k);
  const ctx = cv.getContext("2d");
  let R0 = 0, R1 = LAST;

  const markers = [];
  r.trades.forEach((t, ki) => {
    const bi = r.dates.indexOf(t.buy_date);
    if (bi >= 0) markers.push({ i: bi, type: "buy", k: ki });
    if (!t.open && t.sell_date) {
      const si = r.dates.indexOf(t.sell_date);
      if (si >= 0) markers.push({ i: si, type: "sell", k: ki });
    }
  });
  const bands = [];
  {
    let s = null;
    for (let i = 0; i < N; i++) {
      if (r.pos[i] === 0 && s === null) s = i;
      if ((r.pos[i] === 1 || i === LAST) && s !== null) { bands.push([s, r.pos[i] === 1 ? i : LAST]); s = null; }
    }
  }
  const idx2009 = r.dates.findIndex(d => d >= "2009-01-01");
  const findDate = d => { const i = r.dates.findIndex(x => x >= d); return i < 0 ? LAST : i; };
  const cbands = (r.crises || []).map(c => [findDate(c.start), findDate(c.end)]).filter(([a, b]) => b > a);

  let hitMarkers = [], geo = null;

  function layout() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function niceLogTicks(lo, hi) {
    const ticks = [], bases = [1, 2, 5];
    for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
      for (const b of bases) { const v = b * 10 ** e; if (v >= lo && v <= hi) ticks.push(v); }
    while (ticks.length > 6) for (let i = ticks.length - 2; i >= 0; i -= 2) ticks.splice(i, 1);
    return ticks;
  }

  function draw() {
    if (!cv.clientWidth) return; // hidden panel
    const { w, h } = layout();
    ctx.clearRect(0, 0, w, h);
    const mL = 8, mR = 56, mT = 8, gap = 26;
    const priceH = Math.round((h - mT - gap - 20) * 0.60);
    const eqH = h - mT - priceH - gap - 20;
    const pw = w - mL - mR;
    const x = i => mL + pw * (i - R0) / Math.max(R1 - R0, 1);

    let pLo = Infinity, pHi = -Infinity, eLo = Infinity, eHi = -Infinity;
    for (let i = R0; i <= R1; i++) {
      if (r.close[i] < pLo) pLo = r.close[i];
      if (r.close[i] > pHi) pHi = r.close[i];
      const a = Math.min(r.eq_strat[i], r.eq_bh[i]), b = Math.max(r.eq_strat[i], r.eq_bh[i]);
      if (a < eLo) eLo = a;
      if (b > eHi) eHi = b;
    }
    pLo *= 0.94; pHi *= 1.06; eLo *= 0.94; eHi *= 1.06;
    const yP = v => mT + priceH * (1 - (Math.log(v) - Math.log(pLo)) / (Math.log(pHi) - Math.log(pLo)));
    const yE = v => mT + priceH + gap + eqH * (1 - (Math.log(v) - Math.log(eLo)) / (Math.log(eHi) - Math.log(eLo)));

    ctx.fillStyle = css("--down-soft");
    for (const [a, b] of cbands) {
      if (b < R0 || a > R1) continue;
      const xa = x(Math.max(a, R0)), xb = x(Math.min(b, R1));
      ctx.fillRect(xa, mT, Math.max(xb - xa, 1), priceH);
      ctx.fillRect(xa, mT + priceH + gap, Math.max(xb - xa, 1), eqH);
    }
    ctx.fillStyle = css("--out-soft");
    for (const [a, b] of bands) {
      if (b < R0 || a > R1) continue;
      const xa = x(Math.max(a, R0)), xb = x(Math.min(b, R1));
      ctx.fillRect(xa, mT, Math.max(xb - xa, 1), priceH);
      ctx.fillRect(xa, mT + priceH + gap, Math.max(xb - xa, 1), eqH);
    }

    ctx.font = "11px Segoe UI, system-ui, sans-serif";
    ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--muted");
    ctx.lineWidth = 1; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (const tk of niceLogTicks(pLo, pHi)) {
      ctx.beginPath(); ctx.moveTo(mL, yP(tk)); ctx.lineTo(w - mR, yP(tk)); ctx.stroke();
      ctx.fillText(U + (tk >= 1000 ? (tk / 1000) + "k" : tk), w - mR + 6, yP(tk));
    }
    for (const tk of niceLogTicks(eLo, eHi)) {
      ctx.beginPath(); ctx.moveTo(mL, yE(tk)); ctx.lineTo(w - mR, yE(tk)); ctx.stroke();
      ctx.fillText((tk / 1e4).toLocaleString("en-US") + "×", w - mR + 6, yE(tk));
    }

    // x labels (year boundaries present in the visible window)
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    const y0 = +r.dates[R0].slice(0, 4), y1 = +r.dates[R1].slice(0, 4);
    const step = Math.max(1, Math.ceil((y1 - y0 + 1) / Math.floor(pw / 55)));
    let lastYr = +r.dates[R0].slice(0, 4) - 1;
    for (let i = R0; i <= R1; i++) {
      const yr = +r.dates[i].slice(0, 4);
      if (yr > lastYr) {
        if ((yr - y0) % step === 0 && i > R0 + 2) {
          ctx.fillText(String(yr), x(i), h - 16);
          ctx.strokeStyle = css("--grid");
          ctx.beginPath(); ctx.moveTo(x(i), mT); ctx.lineTo(x(i), h - 20); ctx.stroke();
        }
        lastYr = yr;
      }
    }
    // month labels when zoomed within ~2 years
    if (R1 - R0 < 520) {
      let lastMo = r.dates[R0].slice(0, 7);
      for (let i = R0 + 1; i <= R1; i++) {
        const mo = r.dates[i].slice(0, 7);
        if (mo !== lastMo) {
          const lab = new Date(r.dates[i] + "T00:00:00").toLocaleDateString("en-US", { month: "short" });
          ctx.fillStyle = css("--muted");
          ctx.fillText(lab, x(i), h - 16);
          lastMo = mo;
        }
      }
    }

    if (idx2009 >= R0 && idx2009 <= R1) {
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x(idx2009), mT); ctx.lineTo(x(idx2009), h - 20); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText("2009 split", x(idx2009) + 4, mT + 2);
    }

    function line(arr, yFn, color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
      let started = false;
      const stride = Math.max(1, Math.floor((R1 - R0) / (pw * 2)));
      for (let i = R0; i <= R1; i += stride) {
        const xx = x(i), yy = yFn(arr[i]);
        if (!started) { ctx.moveTo(xx, yy); started = true; } else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    line(r.close, yP, css("--accent"), 1.4);
    line(r.eq_bh, yE, css("--muted"), 1.2);
    line(r.eq_strat, yE, css("--accent"), 1.6);

    ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "600 11px Segoe UI, system-ui, sans-serif";
    ctx.fillText(r.symbol + " CLOSE (LOG)", mL + 2, mT + 2);
    ctx.fillText(`CUMULATIVE GROWTH (×) — ${tagOf(r)} vs BUY & HOLD (LOG)`, mL + 2, mT + priceH + gap + 2);

    hitMarkers = [];
    for (const m of markers) {
      if (m.i < R0 || m.i > R1) continue;
      const xx = x(m.i), yy = yP(r.close[m.i]);
      if (m.type === "buy") {
        ctx.fillStyle = css("--up");
        ctx.beginPath(); ctx.arc(xx, yy + 11, 4.5, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = css("--down");
        ctx.beginPath();
        ctx.moveTo(xx, yy - 6); ctx.lineTo(xx - 4.5, yy - 14); ctx.lineTo(xx + 4.5, yy - 14);
        ctx.closePath(); ctx.fill();
      }
      hitMarkers.push({ x: xx, y: m.type === "buy" ? yy + 11 : yy - 10, m });
    }
    if (R1 - R0 < 2600) {
      ctx.fillStyle = css("--muted"); ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.font = "600 9px Segoe UI, system-ui, sans-serif";
      for (const hm of hitMarkers) if (hm.m.type === "sell")
        ctx.fillText(String(hm.m.k + 1), hm.x, hm.y - 8);
    }
    geo = { x, mL, mR, mT, w, h };
  }

  // --- range buttons
  const rb = document.getElementById("rb-" + k);
  function setBtn(rname) {
    rb.querySelectorAll("button").forEach(o => o.classList.toggle("on", o.dataset.r === rname));
  }
  rb.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      setBtn(b.dataset.r);
      const rr = b.dataset.r;
      if (rr === "all") { R0 = 0; R1 = LAST; }
      else if (rr === "pre") { R0 = 0; R1 = findDate("2010-01-01"); }
      else if (rr === "fed") { R0 = findDate("2010-01-01"); R1 = findDate("2022-01-01"); }
      else if (rr === "infl") { R0 = findDate("2022-01-01"); R1 = LAST; }
      else if (rr === "5y") { R0 = Math.max(0, LAST - 5 * 252); R1 = LAST; }
      else if (rr === "1y") { R0 = Math.max(0, LAST - 252); R1 = LAST; }
      draw();
    };
  });

  // --- zoom (wheel), pan (drag), reset (double-click)
  cv.addEventListener("wheel", ev => {
    ev.preventDefault();
    if (!geo) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const frac = Math.min(Math.max((mx - geo.mL) / (geo.w - geo.mL - geo.mR), 0), 1);
    const center = R0 + frac * (R1 - R0);
    const factor = ev.deltaY > 0 ? 1.18 : 1 / 1.18;
    let span = Math.round((R1 - R0) * factor);
    span = Math.min(Math.max(span, 25), N);
    R0 = Math.round(center - frac * span);
    R1 = R0 + span;
    if (R0 < 0) { R1 -= R0; R0 = 0; }
    if (R1 > LAST) { R0 -= (R1 - LAST); R1 = LAST; R0 = Math.max(R0, 0); }
    setBtn("");
    draw();
  }, { passive: false });

  let dragStart = null, dragged = false;
  cv.addEventListener("mousedown", ev => {
    dragStart = { x: ev.clientX, R0, R1 };
    dragged = false;
  });
  window.addEventListener("mousemove", ev => {
    if (!dragStart || !geo) return;
    const dx = ev.clientX - dragStart.x;
    if (Math.abs(dx) > 3) dragged = true;
    if (!dragged) return;
    const pw = geo.w - geo.mL - geo.mR;
    const span = dragStart.R1 - dragStart.R0;
    let di = Math.round(-dx / pw * span);
    let n0 = dragStart.R0 + di, n1 = dragStart.R1 + di;
    if (n0 < 0) { n1 -= n0; n0 = 0; }
    if (n1 > LAST) { n0 -= (n1 - LAST); n1 = LAST; n0 = Math.max(n0, 0); }
    R0 = n0; R1 = n1;
    cv.style.cursor = "grabbing";
    tt.style.display = "none";
    draw();
  });
  window.addEventListener("mouseup", () => { dragStart = null; cv.style.cursor = "crosshair"; });
  cv.addEventListener("dblclick", () => { R0 = 0; R1 = LAST; setBtn("all"); draw(); });

  // --- tooltip + marker click
  cv.addEventListener("mousemove", ev => {
    if (!geo || dragged) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    let onMarker = null;
    for (const hm of hitMarkers)
      if (Math.abs(hm.x - mx) < 6 && Math.abs(hm.y - my) < 8) { onMarker = hm; break; }
    cv.style.cursor = onMarker ? "pointer" : "crosshair";
    const i = Math.round(R0 + (mx - geo.mL) / (geo.w - geo.mL - geo.mR) * (R1 - R0));
    if (i < R0 || i > R1 || mx < geo.mL || mx > geo.w - geo.mR) { tt.style.display = "none"; return; }
    const tr = onMarker ? r.trades[onMarker.m.k] : null;
    tt.innerHTML = onMarker
      ? `<b>${onMarker.m.type === "buy" ? "BUY" : "SELL"} — trade #${onMarker.m.k + 1}</b><br>
         ${dShort(r.dates[onMarker.m.i])} · ${U}${fmt(r.close[onMarker.m.i])}<br>ROI ${pct(tr.roi)} — click for log row`
      : `<b>${dShort(r.dates[i])}</b><br>${r.symbol} ${U}${fmt(r.close[i])} · regime <b style="color:${r.state[i] === 0 ? "var(--up)" : "var(--down)"}">${r.state[i] === 0 ? "BULL" : "BEAR"}</b>
         · ${r.pos[i] === 1 ? "IN" : "OUT"}<br>${tagOf(r)} ${mult(r.eq_strat[i] / 1e4)} · B&amp;H ${mult(r.eq_bh[i] / 1e4)}`;
    tt.style.display = "block";
    const bw = tt.offsetWidth;
    tt.style.left = Math.min(mx + 14, geo.w - bw - 8) + "px";
    tt.style.top = Math.max(my - 40, 4) + "px";
  });
  cv.addEventListener("mouseleave", () => { tt.style.display = "none"; });
  cv.addEventListener("click", ev => {
    if (dragged) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    for (const hm of hitMarkers)
      if (Math.abs(hm.x - mx) < 7 && Math.abs(hm.y - my) < 9) { flashRow(k, hm.m.k); return; }
  });

  return { draw };
}

// ---------- build ----------
// ref_only payloads (e.g. the NDX reference shipped with the stock dashboard
// solely for the Era Performance NDQ benchmark row) get no tab or panel.
for (const k of KEYS) if (!DATA[k].ref_only) buildPanel(k, DATA[k]);
// Name what the highlight means, and only when something is actually highlighted -
// a permanent legend for an empty state is noise on the ~340 days a year nothing moved.
{
  const moved = KEYS.filter(k => !DATA[k].ref_only && recentChange(DATA[k]).length)
                    .map(k => DATA[k].symbol);
  const note = document.getElementById("chgnote");
  if (note && moved.length) {
    note.style.display = "";
    note.innerHTML = `<span style="color:var(--chg);font-weight:700">${moved.join(", ")}</span>`
      + ` changed in the last ${RECENT_N} trading days — the signal flipped or the flip-risk`
      + ` light moved colour. Hover the ticker for which.`;
  }
}
{
  let histCard = "";
  if (HISTORY.length) {
    const hrows = HISTORY.map(h => `<tr>
      <td class="l" style="font-weight:650; min-width:130px">${h.stage}</td>
      <td class="l" style="min-width:120px">${h.org}</td>
      <td class="l" style="min-width:160px">${h.who}</td>
      <td class="l">${h.what}</td></tr>`).join("");
    histCard = `<div class="card"><h2>Model history — where the Jump Model comes from</h2>
      <div class="tblwrap wraptbl"><table><thead><tr>
        <th class="l">Stage</th><th class="l">Organisation</th><th class="l">Who</th><th class="l">What</th>
      </tr></thead><tbody>${hrows}</tbody></table></div></div>`;
  }
  const mp = document.createElement("div");
  mp.className = "panel"; mp.id = "panel-model";
  // Display order for the model write-ups. A variant missing from this list renders no
  // model card at all - keep it in step with the BBM set near the top of the file.
  const modelCards = ["BL","V1","V2","V3","V4","V5","V6","V7","V9","V10","V11","V12","V13","V14","V15","V16","V17"].filter(s => s in modelCardsBySuffix).map(s => modelCardsBySuffix[s]);
  const boardFirst = KEYS.some(k => BBM.has(DATA[k].variant));
  mp.innerHTML = boardFirst ? modelCards.join("") + histCard
                            : histCard + modelCards.join("");
  panelsEl.appendChild(mp);
  addTab("model", "Model", null);
}
activate(KEYS.find(k => !DATA[k].ref_only));

window.addEventListener("resize", () => { const a = document.querySelector(".tab.active"); if (a) charts[a.dataset.target].draw(); });
const redrawActive = () => { const a = document.querySelector(".tab.active"); if (a) charts[a.dataset.target].draw(); };
new MutationObserver(redrawActive).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawActive);
</script>
