name: Daily update & publish

on:
  schedule:
    # 00:30 UTC Tue-Sat = ~8-8:30pm US Eastern Mon-Fri evenings (a single
    # fixed UTC value can't track DST exactly; this lands 7:30-8:30pm ET
    # depending on season). Chosen because v6 covers gold futures, which
    # settle LATER than the equity close this schedule was originally sized
    # around - safely past both, with hours of buffer past Asia/Europe too.
    - cron: "30 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data (append the latest closes)
        run: python update_data.py
        working-directory: scripts

      - name: Build regimes, payloads and dashboards
        run: |
          python build_regimes.py
          python build_payloads.py
          python build_dashboard.py ../dashboard/index.html NDX SPX HSI HSCEI KOSPI NIKKEI FTSE
          python build_dashboard.py ../dashboard/monitor2.html GOLD ARKQ MSFT NVDA NDX:ref
          python build_regimes_v7.py
          python build_payloads.py --variant=V7
          python build_dashboard.py --variant=V7 ../dashboard/index_v7.html NDX SPX HSI HSCEI KOSPI NIKKEI FTSE
          python build_dashboard.py --variant=V7 ../dashboard/monitor2_v7.html GOLD ARKQ MSFT NVDA NDX:ref
        working-directory: scripts

      - name: Commit refreshed data + dashboards
        run: |
          git config user.name "bull-bear-bot"
          git config user.email "laimanto@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp "dashboard/index.html" _site/index.html
          cp "dashboard/monitor2.html" _site/monitor2.html
          cp "dashboard/index_v7.html" _site/index_v7.html
          cp "dashboard/monitor2_v7.html" _site/monitor2_v7.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
