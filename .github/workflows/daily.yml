name: Daily update & publish

on:
  schedule:
    # 03:30 UTC Tue-Sat (v8, 2026-07-27; was 00:30, and in practice GitHub
    # was firing it ~03:50 anyway).
    #
    # The intraday-bar bug this version fixes was NOT caused by the schedule
    # and cannot be fixed by one - it is fixed by the settlement guard in
    # scripts/update_data.py, which refuses to store any bar whose session
    # has not provably closed. The schedule's only remaining job is to sit
    # where the data we want is actually AVAILABLE, and that argues for a
    # LATER slot, not an earlier one:
    #   - Yahoo does not publish a consolidated daily bar for the Asian
    #     indices until roughly 20h after their close (verified 3x: no
    #     ^HSI bar for Mon 2026-07-20 at 16:54 UTC that day, present by
    #     03:57 UTC the next morning; likewise no 07-27 bar at 18:10 UTC).
    #     An evening-UTC slot would therefore leave HSI/HSCEI/KOSPI/NIKKEI
    #     a full day stale every single day.
    #   - US bars settle 21:30 UTC, London 17:30 UTC - both long done.
    #   - GC=F's Globex session for bar D only finishes 17:00 ET on D+1, so
    #     gold is one day behind whatever we do (see update_data.py).
    # 03:30 UTC on D+1 is the first moment all four venues' day-D bars are
    # both settled and published. The day-D+1 Asian sessions are already
    # trading by then; the guard drops those partial bars.
    - cron: "30 3 * * 2-6"
    # Retry slots. GitHub Actions' `schedule` trigger is best-effort and
    # observably drops/delays runs on low-traffic repos (confirmed here: a
    # slot silently skipped a day and then went dark for 3+ days straight in
    # 2026-07; on 2026-08-04 the 03:30 slot never fired at all and the 05:30
    # one landed at 06:11). The `check` job below only lets a retry slot do
    # real work if nothing has SUCCEEDED yet today, so on a normal day each is
    # a no-op that exits in seconds. All slots sit on the same UTC day, so the
    # job's midnight-anchored "already ran today?" test stays valid.
    #
    # There are three retries rather than one because a run now FAILS when the
    # data it fetched is stale (scripts/check_freshness.py) - and staleness is
    # exactly the condition that a retry a few hours later fixes. On
    # 2026-08-04 Yahoo had no 08-03 bar for the US tickers or the Asian
    # indices at 06:12 UTC but had them all by 17:00 UTC.
    - cron: "30 5 * * 2-6"
    - cron: "30 7 * * 2-6"
    # Last slot of the day: runs with ALLOW_STALE=1, so the freshness check
    # only warns. A venue holiday trips the check exactly like a Yahoo delay
    # does and nothing can distinguish them, so the day must end by publishing
    # whatever exists rather than leaving the boards unbuilt.
    - cron: "0 13 * * 2-6"
  workflow_dispatch:
    inputs:
      allow_stale:
        description: "Publish even if the data is behind (skip the freshness gate)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Only the retry slots need gating - the primary slot and
          # manual/dispatch triggers always run.
          if [ "${{ github.event.schedule }}" = "" ] \
             || [ "${{ github.event.schedule }}" = "30 3 * * 2-6" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today_start="$(date -u +%Y-%m-%dT00:00:00Z)"
          # --method GET is REQUIRED: `gh api` silently switches to POST as
          # soon as any -f parameter is present, and POSTing to the runs-list
          # endpoint 404s. Without it this step failed in <10s every time the
          # fallback fired (observed 2026-07-24 05:34 and 2026-07-25 05:27),
          # so the safety net never actually ran. The original "verified
          # working" check was a manual workflow_dispatch, which exits at the
          # branch above and never reaches this call.
          already_ran=$(gh api --method GET \
            "repos/$REPO/actions/workflows/daily.yml/runs" \
            -f status=success -f created=">=${today_start}" \
            --jq '.workflow_runs | length')
          if [ "$already_ran" -gt 0 ]; then
            echo "Primary run already succeeded today ($already_ran run(s)) - skipping." >&2
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today - running as fallback." >&2
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update-build-deploy:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data (append the latest closes)
        run: |
          python update_data.py
          # hk9988_long.csv is DERIVED (BABA spliced to 9988.HK) - the scored
          # file goes stale unless this runs after every data refresh.
          python splice_hk9988.py
        working-directory: scripts

      # Stop here if update_data came back with nothing new. Yahoo publishes
      # a consolidated daily bar late and erratically (2026-08-04: no 08-03
      # bar for any US ticker or Asian index at 06:12 UTC, all present by
      # 17:00 UTC), and without this step that run still exits 0, still
      # commits, and still publishes boards dated three days stale. Failing
      # here leaves the day's gate open so a retry slot picks it up; the
      # 13:00 UTC slot sets ALLOW_STALE=1 so a venue holiday - which is
      # indistinguishable from a Yahoo delay - still publishes.
      - name: Verify the data is actually current
        run: python check_freshness.py
        working-directory: scripts
        env:
          ALLOW_STALE: ${{ (github.event.schedule == '0 13 * * 2-6' || inputs.allow_stale) && '1' || '0' }}

      # BBM v16 pipeline, ported from the research repo 2026-08-03 (replacing
      # the retired JM v7 build). Warm runs do inference only - the fitcache/
      # holds every JumpModel fit, keyed on the training data itself, so a new
      # fit is expected only at the January rollover (one per market). If the
      # cache stops matching the data (e.g. a --full re-download rescaled
      # history), MAX_NEW_FITS aborts the run rather than training for hours
      # in CI - rebuild locally and commit the refreshed fitcache/ instead.
      - name: Build BBM v16 boards
        run: python rebuild_daily.py
        working-directory: scripts
        env:
          MAX_NEW_FITS: "40"

      - name: Commit refreshed data + results + dashboards
        run: |
          git config user.name "bull-bear-bot"
          git config user.email "laimanto@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp "dashboard/index.html" _site/index.html
          cp "dashboard/us.html" _site/us.html
          cp "dashboard/hk.html" _site/hk.html
          cp "dashboard/commodity.html" _site/commodity.html
          cp "dashboard/monitor2.html" _site/monitor2.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
